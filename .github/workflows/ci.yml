name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build src/Jc.AI.slnx --configuration Release

      - name: Run unit tests
        run: dotnet test src/Jc.AI.slnx --configuration Release --no-build

      - name: Run data demo
        run: dotnet src/Jc.AI.Demo/bin/Release/net10.0/Jc.AI.Demo.dll data

      - name: Run tokenize demo
        run: dotnet src/Jc.AI.Demo/bin/Release/net10.0/Jc.AI.Demo.dll tokenize

      - name: Run tokenize demo with testing
        run: dotnet src/Jc.AI.Demo/bin/Release/net10.0/Jc.AI.Demo.dll tokenize testing

      - name: Run bigram demo
        run: dotnet src/Jc.AI.Demo/bin/Release/net10.0/Jc.AI.Demo.dll bigram

      - name: Run neuron demo
        run: dotnet src/Jc.AI.Demo/bin/Release/net10.0/Jc.AI.Demo.dll neuron
